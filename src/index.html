<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>S2iD Contingência Pro</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gestão operacional de planos de contingência, abrigos temporários, frota de resgate e IA prescritiva para alocação logística. Offline first, sem servidor.">
  <meta name="author" content="Luiz Henrique Porfírio Santos">
  <meta name="theme-color" content="#f7f7f5">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <script>
    try {
      var raw = localStorage.getItem('s2id_pro_theme');
      var choice = raw ? JSON.parse(raw) : 'system';
      var dark = choice === 'dark'
        || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);

      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (dark) {
        document.querySelector('meta[name="theme-color"]').content = '#0b0b0a';
      }
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400..500,0..1,0&display=block"
    rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
